name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compare official vectors externally
        run: curl --fail --location --retry 3 https://tnid.info/test-vectors.json --output "$RUNNER_TEMP/tnid-test-vectors.json"
      - run: bash scripts/verify.sh --net11
        env:
          TNID_TEST_VECTORS: ${{ runner.temp }}/tnid-test-vectors.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TNID.NET-verification
          path: |
            artifacts/*.nupkg
            artifacts/*.sha256
            artifacts/*.log
            artifacts/sdk-*.txt
